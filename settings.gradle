rootProject.name = 'kwik'

include('core')
include('qlog')
include('interop')
include('cli')
include('samples')
include('h09')

project(":core").name = "kwik"
project(":qlog").name = "kwik-qlog"
project(":interop").name = "kwik-interop"
project(":cli").name = "kwik-cli"
project(":samples").name = "kwik-samples"
project(":h09").name = "kwik-h09"

// Build against a sibling agent15 checkout, when there is one, rather than the fork's JitPack build
if (file('../agent15').isDirectory() && System.getenv('JITPACK') == null) includeBuild('../agent15') {
    dependencySubstitution {
        substitute module('com.github.Peergos:agent15') using project(':core')
    }
}
